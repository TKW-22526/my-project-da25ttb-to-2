<!DOCTYPE html>
<html lang = "vi">
	<head>
		<title>Nhập dữ liệu và hiển thị với prompt và alert</title>
		<meta charset = "utf-8">
		<!--<link rel = "stylesheet" href = "../css/style01.css">-->
	</head>
	<body>
		
		<script>
			let name = prompt("Nhập vào tên của bạn: ");
            let yob = Number(prompt("Nhập vào năm sinh của bạn: "));
            //alert("Chào bạn " + name + ", năm 2026 bạn đã " + (2026 - yob) + " rồi đó.");
            alert(`Chào bạn  ${name} , năm 2026 bạn đã ${2026 - yob} rồi đó.`);
		</script>
	</body>
</htmls
