<!DOCTYPE html>
<html lang = "vi">
	<head>
		<title>Thiết kế form đăng nhập</title>
		<meta charset = "utf-8">
		<link href = "../css/style02.css" rel = "stylesheet">
	</head>
	<body>
		<div class = "container">
			
			<form id= "frmLogin">
				<h2 id = "title">Form Login</h2>
				<div class = "form-group">
					<label for = "txtUsername">Username:</label>
					<input class = "form-control" type = "text" id = "txtUsername" name = "txtUsername">
				</div>
				<div class = "form-group">
					<label for = "txtPassword">Password:</label>
					<input class = "form-control" type = "password" id = "txtPassword" name = "txtPassword">
				</div>
				<input class = "button" type = "submit" name = "sbLogin" id = "sbLogin" value = "Login">
				<input class = "button"  type = "reset" name = "rsCancel" id = "rsCancel" value = "Cancel">
			</form>
		</div>
	</body>
</html
